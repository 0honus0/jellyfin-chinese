<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>黑体</family>
    <prefer>
      <family>ZCOOL KuaiLe</family>
      <family>ZCOOL XiaoWei</family>
      <family>Ma Shan Zheng</family>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>SimHei</family>
    <prefer>
      <family>ZCOOL KuaiLe</family>
      <family>ZCOOL XiaoWei</family>
      <family>Ma Shan Zheng</family>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>微软雅黑</family>
    <prefer>
      <family>ZCOOL KuaiLe</family>
      <family>ZCOOL XiaoWei</family>
      <family>Ma Shan Zheng</family>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Microsoft YaHei</family>
    <prefer>
      <family>ZCOOL KuaiLe</family>
      <family>ZCOOL XiaoWei</family>
      <family>Ma Shan Zheng</family>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>宋体</family>
    <prefer>
      <family>ZCOOL XiaoWei</family>
      <family>Noto Serif CJK SC</family>
      <family>serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>SimSun</family>
    <prefer>
      <family>ZCOOL XiaoWei</family>
      <family>Noto Serif CJK SC</family>
      <family>serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>楷体</family>
    <prefer>
      <family>Ma Shan Zheng</family>
      <family>ZCOOL XiaoWei</family>
      <family>Noto Serif CJK SC</family>
      <family>serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>KaiTi</family>
    <prefer>
      <family>Ma Shan Zheng</family>
      <family>ZCOOL XiaoWei</family>
      <family>Noto Serif CJK SC</family>
      <family>serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>方正黑体</family>
    <prefer>
      <family>ZCOOL KuaiLe</family>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>方正兰亭黑</family>
    <prefer>
      <family>ZCOOL KuaiLe</family>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>华文黑体</family>
    <prefer>
      <family>ZCOOL KuaiLe</family>
      <family>Noto Sans CJK SC</family>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>华文宋体</family>
    <prefer>
      <family>ZCOOL XiaoWei</family>
      <family>Noto Serif CJK SC</family>
      <family>serif</family>
    </prefer>
  </alias>
</fontconfig>
